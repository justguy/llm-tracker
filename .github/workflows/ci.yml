name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ["18", "20", "22"]
        include:
          # macOS: cover Node 18 AND 20 (DoD: hub/** tests on {macOS, Linux} x {18, 20})
          - os: macos-latest
            node-version: "18"
          - os: macos-latest
            node-version: "20"
          # Platform smoke: one LTS node on Windows
          - os: windows-latest
            node-version: "20"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Guard single session funnel
        run: |
          if grep -RE "StartSessionWizard|function Stepper|Skill plan', 'Confirm" hub_design/variants/session-hub-modals.jsx docs/session-hub; then
            echo "Deprecated multi-step session launcher detected. Route launches through the single Run Session funnel."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run
        name: Verify package contents
